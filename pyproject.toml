[project]
name = "brrragent"
version = "0.3.0"
description = "Reusable agent loop with multi-provider routing and MCP tool calling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1,<2",
    "openai>=1.66.0",
]

[project.scripts]
brrragent-auth = "brrragent.auth_cli:main"

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]

[dependency-groups]
dev = [
    "check-wheel-contents>=0.6,<0.7",
    "pytest>=8.0.0",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
    "twine>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brrragent"]

[tool.hatch.build.targets.sdist]
exclude = ["/.gitignore"]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["brrragent"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
