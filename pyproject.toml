[project]
name = "brrragent"
version = "0.3.0"
description = "Reusable agent loop with multi-provider routing and MCP tool calling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1,<2",
    "openai>=1.66.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brrragent"]
