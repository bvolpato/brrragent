name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked --python 3.12

      - name: Verify lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Compile package
        run: uv run python -m compileall -q src tests

      - name: Build distributions
        run: uv build --clear

      - name: Validate distributions
        run: |
          uv run twine check dist/*
          uv run check-wheel-contents dist/*.whl

      - name: Smoke test built distributions
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          wheel_env=$(mktemp -d)
          sdist_env=$(mktemp -d)
          uv venv "$wheel_env"
          uv venv "$sdist_env"
          uv pip install --python "$wheel_env/bin/python" "${wheel}[gemini]"
          uv pip install --python "$sdist_env/bin/python" "${sdist}[gemini]"
          smoke_code='
          from brrragent import KeyPool, McpServerConfig, PromptCacheConfig, run_agent
          import brrragent.agent
          import brrragent.auth_cli
          import brrragent.codex_oauth
          import brrragent.gemini
          import brrragent.keys
          import brrragent.mcp_tools
          import brrragent.openai_direct
          import brrragent.openrouter
          import brrragent.prompt_cache

          assert KeyPool(["smoke-key"]).acquire() == "smoke-key"
          assert PromptCacheConfig("smoke:v1").mode == "explicit"
          assert McpServerConfig(
              name="local", transport="stdio", command="true"
          ).command == "true"
          '
          "$wheel_env/bin/python" -c "$smoke_code"
          "$sdist_env/bin/python" -c "$smoke_code"
          "$wheel_env/bin/brrragent-auth" --help
          "$sdist_env/bin/brrragent-auth" --help

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -q --cov=brrragent --cov-report=term-missing

  minimum-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked --python 3.12

      - name: Install minimum provider SDKs
        run: uv pip install "openai==2.45.0" "google-genai==1.0.0"

      - name: Run tests with minimum provider SDKs
        run: uv run --no-sync pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
