name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: arc-self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Restore uv cache
        run: gcs-cache restore uv "${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}" "$HOME/.cache/uv" "$HOME/.local/share/uv"


      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Save uv cache
        if: always()
        run: gcs-cache save uv "${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}" "$HOME/.cache/uv" "$HOME/.local/share/uv"

      - name: Run tests
        run: uv run pytest

      - name: Compile package
        run: uv run python -m compileall src tests
