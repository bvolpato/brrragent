name: Latest dependencies

on:
  schedule:
    - cron: "23 8 * * 2"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/latest-dependencies.yml
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: latest-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install latest compatible dependencies
        run: uv sync --all-extras --dev --upgrade --python ${{ matrix.python-version }}

      - name: Check installed dependencies
        run: uv pip check

      - name: Run token-free tests
        run: uv run --no-sync pytest -q --cov=brrragent --cov-report=term-missing
